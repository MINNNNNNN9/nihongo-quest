# Render Blueprint：在 Render 選「New → Blueprint」並連到這個 repo，就會照這份設定建立服務。
# 步驟見 docs/deployment.md 的「部署到 Render（免費方案）」。
services:
  - type: web
    name: nihongo-quest
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./deploy/render/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      # 建立時會要求輸入：託管 PostgreSQL 的連線網址（例如 Neon 的 Connection string）
      - key: DATABASE_URL
        sync: false
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      # 後台超級管理員：啟動時若這個帳號不存在就建立（之後改密碼請在後台改，這裡不會覆蓋）
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      # 找回密碼的寄信設定（選用）：Brevo 的 API 金鑰與驗證過的寄件信箱
      - key: BREVO_API_KEY
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
